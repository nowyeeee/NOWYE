*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}input,select{width:100%;padding:13px;border:1px solid #ccd8ce;border-radius:12px;margin-top:7px;background:#fff}
.logo{font-weight:900;font-size:28px;letter-spacing:1px;color:#6E9E38}
.auth{min-height:100vh;background:linear-gradient(135deg,#E7F5D2,#FFF7C7);display:grid;grid-template-columns:1fr 420px;gap:60px;align-items:center;padding:7vw;color:#fff}
.auth h1{font-size:68px;line-height:1.03;margin:20px 0}.auth h1 span{color:#D49B00}.auth p{font-size:19px;line-height:1.6;color:#5E6955;max-width:650px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 15px 45px #14331a12}.auth .card{color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf4ee;padding:5px;border-radius:12px;margin-bottom:20px}.tabs button{border:0;background:none;padding:11px;border-radius:9px}.tabs .on{background:#fff;font-weight:800}
.primary{width:100%;border:0;background:var(--yellow);color:#3A4B20;font-weight:900;padding:14px;border-radius:12px;margin-top:8px}
.notice{padding:12px;border-radius:12px;background:#FFF6CF;color:#7C6500;margin:12px 0}.success{padding:12px;border-radius:12px;background:#E8F6D8;color:#477021;margin-top:12px}
.page header{background:#FFFFFF;color:#fff;padding:20px 7vw;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:760px;margin:45px auto;padding:0 18px}.wrap h1{font-size:42px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash header{background:#FFFFFF;color:#fff;padding:18px 7vw;display:flex;justify-content:space-between;align-items:center}.head{display:flex;align-items:center;gap:16px}.head button{background:#FFF7C7;color:#5A651E;border:1px solid #E4CF76;padding:8px 12px;border-radius:9px}.headbtn{background:#E7F5D2;color:#4C6B28;border:1px solid #C8DDB0;padding:8px 12px;border-radius:9px}
.dashboard{max-width:1120px;margin:30px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#DDF1C8,#FFF3B7);color:var(--ink);border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{font-size:36px;max-width:650px}.score{background:#FFFFFF;color:var(--ink);border-radius:18px;padding:20px;text-align:center;min-width:150px}.score b{display:block;font-size:34px}.score small,.score span{color:var(--muted);display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stats .card{padding:18px}.stats b{font-size:21px;display:block}.muted{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choices{display:grid;gap:10px;margin:16px 0}.choice{border:2px solid var(--line);background:#fff;border-radius:14px;text-align:left;padding:14px;font-weight:800}.choice.active{border-color:var(--g);background:#F0F8E3}.choice small{display:block;color:var(--muted);margin-top:4px;font-weight:400}
.drop{border:2px dashed #b9c9bb;border-radius:18px;padding:45px 10px;text-align:center;display:block;color:#22732d;cursor:pointer}.drop input{display:none}
.timeline div{display:grid;grid-template-columns:190px 1fr;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.timeline span{color:var(--muted)}
.loading{min-height:100vh;display:grid;place-items:center;font-weight:800}footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:800px){.auth{grid-template-columns:1fr;padding:35px 18px}.auth h1{font-size:50px}.two,.cols{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{flex-direction:column;align-items:flex-start}.score{width:100%}.timeline div{grid-template-columns:1fr}}

.safety{font-size:12px;line-height:1.45;color:#66736a;background:#f5f8f5;border:1px solid #dfe8e0;border-radius:12px;padding:10px;margin-top:12px}
.kpi{font-size:28px;font-weight:900}.meter{height:9px;background:#e8efe9;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:#8BC34A;width:0}
.actiongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.action b{display:block;margin-bottom:5px}.mini{font-size:13px;color:var(--muted)}
.preview{max-width:100%;max-height:280px;border-radius:16px;margin-top:14px;display:none}
.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#FFF3B7;color:#7A6400;font-size:12px;font-weight:800}

.planner{display:grid;gap:10px;margin-top:14px}
.planner-row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center}
.planner-row input,.planner-row select{margin-top:0}
.meal-list{display:grid;gap:8px;margin-top:12px}
.meal-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px}
.meal-item small{display:block;color:var(--muted);margin-top:3px}
.danger{border:1px solid #e0b4b4;background:#fff5f5;color:#8b2222;border-radius:9px;padding:8px 10px}
.notifybox{margin-top:10px}

.reminder-grid{display:grid;gap:10px;margin-top:14px}
.reminder-item{display:grid;grid-template-columns:90px 120px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.reminder-item input,.reminder-item select{margin-top:0}
.reminder-item button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}
.tip{padding:10px;border-radius:12px;background:#f5f8f5;color:#425047;margin-top:10px}
@media(max-width:800px){.reminder-item{grid-template-columns:1fr 1fr}.reminder-item input{grid-column:1/-1}.reminder-item button{grid-column:2}}

/* NOWYE DİYET: vertical page flow */
html,body{min-height:100%;overflow-x:hidden;overflow-y:auto}
#app{min-height:100vh;overflow:visible}
.dashboard{display:block;min-height:auto;max-width:1120px;margin:30px auto;padding:0 18px 40px}
.dashboard>*{width:100%;max-width:none;box-sizing:border-box}
.dash{min-height:100vh;height:auto;overflow:visible}.dash .dashboard{padding-bottom:40px}
.intro-shell{display:block;height:auto;overflow:visible}
.intro-slide{width:100%;min-height:62vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;background:linear-gradient(135deg,#E7F5D2,#FFF7C7);color:var(--ink)}
.intro-content{width:min(760px,92vw);text-align:center}.intro-brand{font-size:clamp(52px,12vw,92px);font-weight:900;letter-spacing:-.05em;color:#6E9E38}.intro-content h1{font-size:clamp(28px,5vw,46px);margin:6px 0 12px}.intro-content p{font-size:16px;line-height:1.65;color:#5E6955;max-width:640px;margin:0 auto}.intro-how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px auto;max-width:720px}.intro-how>div{background:#FFFFFF;border:1px solid #D8E7C9;border-radius:15px;padding:14px;text-align:left}.intro-how b{display:block;margin-bottom:4px}.intro-how span{font-size:13px;color:#68735F}.intro-auth{width:100%;height:auto;overflow:visible}
@media(max-width:700px){.intro-how{grid-template-columns:1fr}.intro-slide{padding:20px;min-height:55vh}.intro-content{padding:8px}.intro-content .primary{max-width:260px}}

.hero:after{
  content:"🍋";position:absolute;right:22px;bottom:-8px;font-size:90px;opacity:.13;transform:rotate(-12deg);
}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.feature-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 30px #14331a0b}
.feature-card h3{margin:0 0 8px}.feature-card p{margin:0;color:var(--muted);line-height:1.55}
.meal-photo{
  width:100%;height:220px;object-fit:cover;border-radius:18px;
  border:1px solid var(--line);background:#f6f8f1;
}
.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.photo-actions label,.photo-actions button{display:flex;align-items:center;justify-content:center}
.photo-actions input{display:none}
.reference-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.ref-box{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fbfdf8}
.ref-box b{display:block;font-size:20px}.ref-box small{color:var(--muted)}
.workout-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.workout{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.workout b{display:block;margin-bottom:5px}
.workout span{font-size:13px;color:var(--muted)}
.motivation{background:linear-gradient(135deg,#f2f9e8,#fff7c7);border:1px solid #dfe9c6;border-radius:18px;padding:18px;margin-top:12px}
.motivation b{font-size:18px}
.metric-form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric-form input{margin-top:0}
.metric-history{display:grid;gap:8px;margin-top:12px}
.metric-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}

function calcTarget(p){
 const w=Number(p.weight_kg)||0,h=Number(p.height_cm)||0,a=Number(p.age)||30;
 const sex=p.sex==="Erkek"?5:-161;
 const bmr=Math.max(1200,10*w+6.25*h-5*a+sex);
 const mult=p.activity_level==="high"?1.6:p.activity_level==="low"?1.25:1.4;
 let t=Math.round(bmr*mult);
 if(p.goal==="lose") t=Math.max(1200,t-350);
 if(p.goal==="gain") t+=250;
 return t;
}

async function setupRealPush(user){
  const box=document.getElementById("notifyMsg");
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){
      throw new Error("Bu cihaz gerçek push bildirimini desteklemiyor.");
    }
    const permission=await Notification.requestPermission();
    if(permission!=="granted") throw new Error("Bildirim izni verilmedi.");

    const reg=await navigator.serviceWorker.register("./sw.js");
    let sub=await reg.pushManager.getSubscription();

    if(!sub){
      const {data,error}=await db.functions.invoke("vapid-public-key",{body:{}});
      if(error) throw new Error(error.message||"VAPID public key alınamadı.");
      const publicKey=data?.publicKey;
      if(!publicKey) throw new Error("VAPID public key alınamadı.");
      const raw=atob(publicKey.replace(/-/g,"+").replace(/_/g,"/"));
      const key=Uint8Array.from(raw,c=>c.charCodeAt(0));
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    }

    const j=sub.toJSON();
    if(!j.endpoint || !j.keys?.p256dh || !j.keys?.auth) throw new Error("Telefon aboneliği oluşturulamadı.");

    const {error}=await db.from("push_subscriptions").upsert({
      user_id:user.id,
      endpoint:j.endpoint,
      p256dh:j.keys.p256dh,
      auth:j.keys.auth
    },{onConflict:"user_id,endpoint"});

    if(error) throw new Error(error.message||"Telefon aboneliği kaydedilemedi.");

    if(box) box.innerHTML='<div class="success">✓ Telefon bildirimleri bağlandı.</div>';
  }catch(err){
    if(box) box.innerHTML='<div class="notice">Bildirim kurulamadı: '+(err?.message||String(err))+'</div>';
  }
}

  {id:"breakfast", time:"08:30", type:"Kahvaltı", text:"Kahvaltı zamanı 🌱 Protein + lif içeren dengeli bir öğün seç."},

];

function reminderKey(userId){ return "nowes_reminders_"+userId; }
function getReminders(userId){
  try{
    const saved=JSON.parse(localStorage.getItem(reminderKey(userId))||"null");
    return Array.isArray(saved)&&saved.length?saved:DEFAULT_REMINDERS.map(x=>({...x}));
  }catch(_){ return DEFAULT_REMINDERS.map(x=>({...x})); }
}
function saveReminders(userId,items){ localStorage.setItem(reminderKey(userId),JSON.stringify(items)); }

function suggestionFor(type){
  const m={
    "Kahvaltı":"Yumurta + yoğurt + sebze veya yulaf + yoğurt + meyve.",
    "Öğle":"Tavuk/balık/kurubaklagil + bol salata veya sebze + ayran/yoğurt.",
    "Ara öğün":"1 porsiyon meyve + yoğurt veya küçük bir avuç kuruyemiş.",
    "İkindi":"Meyve + kefir/yoğurt veya hafif bir sandviç.",
    "Akşam":"Protein kaynağı + sebze/salata + ihtiyaca göre küçük bir karbonhidrat porsiyonu.",
    "Gece":"Açlık varsa yoğurt/kefir gibi hafif bir seçenek."
  };
  return m[type]||"Dengeli, yeterli ve sana uygun bir seçenek seç.";
}

function notifyUser(title,body){
  try{
    if("Notification" in window && Notification.permission==="granted"){
      new Notification(title,{body});
    }
  }catch(_){}
  const box=document.getElementById("notifyMsg");
  if(box) box.innerHTML='<div class="success">🔔 '+body+'</div>';
}

function startReminderLoop(user,p){
  if(window.__nowesReminderTimer) clearInterval(window.__nowesReminderTimer);
  const run=()=>{
    const reminders=getReminders(user.id);
    const now=new Date();
    const hh=String(now.getHours()).padStart(2,"0");
    const mm=String(now.getMinutes()).padStart(2,"0");
    const stamp=now.toISOString().slice(0,10)+"_"+hh+mm;
    reminders.forEach(r=>{
      if(r.enabled!==false && r.time===hh+":"+mm){
        const sentKey="nowes_sent_"+user.id+"_"+r.id+"_"+stamp;
        if(!sessionStorage.getItem(sentKey)){
          sessionStorage.setItem(sentKey,"1");
          notifyUser("NOWYE · "+r.type, r.text+" Öneri: "+suggestionFor(r.type));
        }
      }
    });
  };
  run();
  window.__nowesReminderTimer=setInterval(run,30000);
}

 const reminderList=document.getElementById("reminderList");
 let reminderDraft=getReminders(user.id);
 function renderReminderDraft(){
   reminderList.innerHTML=reminderDraft.map((r,i)=>`
    <div class="reminder-item">
      <input type="time" value="${r.time}" data-ri="${i}" data-field="time">
      <select data-ri="${i}" data-field="type">
        ${["Kahvaltı","Ara öğün","Öğle","İkindi","Akşam","Gece"].map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
      </select>
      <input value="${(r.text||"").replace(/"/g,"&quot;")}" placeholder="Bildirim metni" data-ri="${i}" data-field="text">
      <button type="button" data-del-reminder="${i}">Sil</button>
    </div>`).join("");
   reminderList.querySelectorAll("[data-field]").forEach(el=>el.oninput=()=>{
     const i=Number(el.dataset.ri); reminderDraft[i][el.dataset.field]=el.value;
   });
   reminderList.querySelectorAll("[data-del-reminder]").forEach(b=>b.onclick=()=>{
     reminderDraft.splice(Number(b.dataset.delReminder),1); renderReminderDraft();
   });
 }
 renderReminderDraft();
 document.getElementById("addReminder").onclick=()=>{
   reminderDraft.push({id:"custom_"+Date.now(),time:"20:00",type:"Gece",text:"Şimdi öğün/su hedefini kontrol et. 🌱"});
   renderReminderDraft();
 };
 document.getElementById("saveReminders").onclick=()=>{
   saveReminders(user.id,reminderDraft);
   notifyUser("NOWYE","Öğün hatırlatıcıların kaydedildi. ✅");
   startReminderLoop(user,p);
 };

   document.getElementById("waterKpi").textContent=water+" / "+waterTarget;
   document.getElementById("waterMeter").style.width=Math.min(100,water/waterTarget*100)+"%";
   if(water>=waterTarget) notify("NOWYE","🎉 Su hedefini tamamladın!"); updateDailyGoal();
 };

 };

 // Öğün saatine göre genel referans kartı
 function updateMealReference(){
   const h=new Date().getHours(), m=new Date().getMinutes();
   let label="Gün içi";
   if(h<10) label="Kahvaltı";
   else if(h<12) label="Ara öğün";
   else if(h<15) label="Öğle";
   else if(h<18) label="Ara öğün";
   else if(h<21) label="Akşam";
   else label="Gece";
   document.getElementById("mealRefTime").textContent=label+" · "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
 }
 updateMealReference();
 setInterval(updateMealReference,60000);

 // Kilo/vücut ölçüm geçmişi
 const metricKey="nowye_metrics_"+user.id;
 function getMetrics(){
   try{return JSON.parse(localStorage.getItem(metricKey)||"[]")}catch(_){return []}
 }
 function renderMetrics(){
   const rows=getMetrics();
   const box=document.getElementById("metricHistory");
   if(!rows.length){box.innerHTML='<div class="muted">Henüz ölçüm kaydı yok.</div>';return;}
   box.innerHTML=rows.slice(0,8).map(x=>`
     <div class="metric-row">
       <span>${x.date}</span>
       <span><b>${x.weight?x.weight+" kg":"—"}</b> · ${x.waist?x.waist+" cm":"—"} · ${x.bodyFat?x.bodyFat+"%":"—"}</span>
     </div>`).join("");
 }
 renderMetrics();
 document.getElementById("saveMetrics").onclick=()=>{
   const weight=document.getElementById("metricWeight").value;
   const waist=document.getElementById("metricWaist").value;
   const bodyFat=document.getElementById("metricBodyFat").value;
   if(!weight && !waist && !bodyFat){
     document.getElementById("metricMsg").innerHTML='<div class="notice">En az bir ölçüm gir.</div>';return;
   }
   const rows=getMetrics();
   rows.unshift({date:new Date().toLocaleString("tr-TR"),weight,waist,bodyFat});
   localStorage.setItem(metricKey,JSON.stringify(rows.slice(0,30)));
   document.getElementById("metricWeight").value="";
   document.getElementById("metricWaist").value="";
   document.getElementById("metricBodyFat").value="";
   document.getElementById("metricMsg").innerHTML='<div class="success">✓ Ölçüm kaydedildi.</div>';
   renderMetrics();
 };

 // Kişisel egzersizler + günlük başarı madalyası
 const exerciseKey="nowye_exercises_"+user.id;
 function getCustomExercises(){try{return JSON.parse(localStorage.getItem(exerciseKey)||"[]")}catch(_){return []}}
 function renderCustomExercises(){
   const box=document.getElementById("customExerciseList"); if(!box)return;
   const rows=getCustomExercises();
   box.innerHTML=rows.length?rows.map((x,i)=>`<div class="exercise-row"><div><b>${escapeHtml(x.name)}</b><small>${x.sets} set · ${escapeHtml(x.reps)}</small></div><button class="action" data-done-ex="${i}">✓ Yaptım</button><button class="danger" data-del-ex="${i}">Sil</button></div>`).join(""):'<div class="muted">Henüz kendi egzersizini eklemedin.</div>';
   box.querySelectorAll("[data-done-ex]").forEach(b=>b.onclick=()=>{ localStorage.setItem("nowye_exercise_done_"+user.id+"_"+new Date().toISOString().slice(0,10),"1"); notify("NOWYE","🏋️ Egzersiz tamamlandı! Günlük hedefin güncellendi."); updateDailyGoal(); });
   box.querySelectorAll("[data-del-ex]").forEach(b=>b.onclick=()=>{const a=getCustomExercises();a.splice(Number(b.dataset.delEx),1);localStorage.setItem(exerciseKey,JSON.stringify(a));renderCustomExercises();});
 }
 function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
 document.getElementById("addCustomExercise").onclick=()=>{
   const name=document.getElementById("customExerciseName").value.trim(), sets=Number(document.getElementById("customExerciseSets").value)||3, reps=document.getElementById("customExerciseReps").value.trim()||"10 tekrar";
   if(!name)return; const a=getCustomExercises(); a.push({name,sets,reps}); localStorage.setItem(exerciseKey,JSON.stringify(a));
   document.getElementById("customExerciseName").value=""; document.getElementById("customExerciseReps").value=""; renderCustomExercises();
 };
 renderCustomExercises();

 function updateDailyGoal(){
   const today=new Date().toISOString().slice(0,10);
   const mealDone=(logs||[]).filter(x=>String(x.created_at||"").slice(0,10)===today).length>=3;
   const waterDone=water>=waterTarget;
   const exerciseDone=localStorage.getItem("nowye_exercise_done_"+user.id+"_"+today)==="1";
   const done=[waterDone,mealDone,exerciseDone].filter(Boolean).length;
   const bar=document.getElementById("dailyGoalBar"); if(bar)bar.style.width=(done/3*100)+"%";
   const txt=document.getElementById("dailyGoalText"); if(txt)txt.textContent=done+" / 3 tamamlandı";
   [["checkWater",waterDone],["checkMeals",mealDone],["checkExercise",exerciseDone]].forEach(([id,ok])=>{const el=document.getElementById(id);if(el)el.classList.toggle("ok",ok);});
   const medal=document.getElementById("dailyMedal");
   if(medal){
     if(done===3){ medal.classList.add("unlocked"); medal.innerHTML='<span class="icon">🏅</span><b>Madalyan açıldı!</b><small>Bugünün hedefini tamamladın 🎉</small>'; const key="nowye_medal_"+user.id+"_"+today; if(!localStorage.getItem(key)){localStorage.setItem(key,"1"); notify("NOWYE DİYET","🏅 Tebrikler! Bugünün tüm hedeflerini tamamladın!");} }
     else {medal.classList.remove("unlocked"); medal.innerHTML='<span class="icon">🏅</span><b>Henüz açılmadı</b><small>Bugünü tamamla!</small>';}
   }
 }
 updateDailyGoal();

 // Günlük motivasyon
 const motivation=[
   "Bugün küçük bir adım at; yarınki sen bunun için teşekkür edecek. 🍋",
   "Mükemmel olmak zorunda değilsin; devam etmek yeterli. 🌱",
   "Bir öğün, bir yürüyüş, bir bardak su: küçük adımlar büyük fark yaratır. 💚",
   "Bugün kendine yatırım yapmanın güzel bir günü. ✨",
   "Hedefin uzak görünse bile attığın her adım seni yaklaştırıyor. 💪"
 ];
 const dayIndex=Math.floor(Date.now()/86400000)%motivation.length;
 document.getElementById("dailyMotivation").textContent=motivation[dayIndex];
 document.getElementById("sendMotivationNow").onclick=()=>{
   notify("NOWYE DİYET",motivation[dayIndex]);
 };
 const dailyKey="nowye_motivation_"+user.id+"_"+new Date().toISOString().slice(0,10);
 function scheduleDailyMotivation(){
   if(!("Notification" in window) || Notification.permission!=="granted") return;
   const now=new Date(), next=new Date(now); next.setHours(9,0,0,0); if(next<=now) next.setDate(next.getDate()+1);
   clearTimeout(window.__nowyeMotivationTimer);
   window.__nowyeMotivationTimer=setTimeout(()=>{
     const d=new Date().toISOString().slice(0,10), k="nowye_motivation_"+user.id+"_"+d;
     if(!localStorage.getItem(k)){notify("NOWYE DİYET",motivation[Math.floor(Date.now()/86400000)%motivation.length]);localStorage.setItem(k,"1");}
     scheduleDailyMotivation();
   },Math.max(1000,next-now));
 }
 if(!localStorage.getItem(dailyKey) && "Notification" in window && Notification.permission==="granted"){
   setTimeout(()=>notify("NOWYE DİYET",motivation[dayIndex]),1200);
   localStorage.setItem(dailyKey,"1");
 }
 scheduleDailyMotivation();

 if("Notification" in window && Notification.permission==="granted" && water>=waterTarget) {
   setTimeout(()=>notify("NOWYE","🎉 Bugünün su hedefi tamamlandı!"),300);
 }
}

db.auth.onAuthStateChange(()=>setTimeout(boot,0));
boot();

  function sameMinute(target){
    const now=new Date();
    const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    return hm===target;
  }

  function dailyOnce(tag){
    const d=new Date().toISOString().slice(0,10);
    const k="nowye_sent_"+d+"_"+tag;
    if(localStorage.getItem(k)) return false;
    localStorage.setItem(k,"1");
    return true;
  }

<script>
(function () {
  document.addEventListener("click", async function (e) {

    /* 🔔 BİLDİRİMLERİ AÇ */
    const pushBtn = e.target.closest("#enableBrowserNotifications");

    if (pushBtn) {
      e.preventDefault();
      e.stopImmediatePropagation();

      try {
        if (!("Notification" in window)) {
          alert("Bu cihaz bildirimleri desteklemiyor.");
          return;
        }

        let permission = Notification.permission;

        if (permission !== "granted") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          alert("Bildirim izni verilmedi.");
          return;
        }

        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          alert("Bu cihaz gerçek push bildirimini desteklemiyor.");
          return;
        }

        const reg = await navigator.serviceWorker.register("./sw.js");

        let sub = await reg.pushManager.getSubscription();

        if (!sub) {
          const { data, error } =
            await db.functions.invoke("vapid-public-key", { body: {} });

          if (error) throw new Error(error.message);

          const publicKey = data?.publicKey;

          if (!publicKey) {
            throw new Error("VAPID public key alınamadı.");
          }

          const raw = atob(
            publicKey.replace(/-/g, "+").replace(/_/g, "/")
          );

          const key = Uint8Array.from(raw, c => c.charCodeAt(0));

          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: key
          });
        }

        const j = sub.toJSON();

        const { data: userData, error: userError } =
          await db.auth.getUser();

        if (userError || !userData?.user) {
          throw new Error("Önce NOWYE hesabına giriş yapmalısın.");
        }

        const { error: saveError } =
          await db.from("push_subscriptions").upsert({
            user_id: userData.user.id,
            endpoint: j.endpoint,
            p256dh: j.keys.p256dh,
            auth: j.keys.auth
          }, {
            onConflict: "user_id,endpoint"
          });

        if (saveError) throw new Error(saveError.message);

        alert("🔔 Bildirimler başarıyla açıldı!");

      } catch (err) {
        console.error(err);
        alert("Bildirim kurulamadı: " + (err?.message || err));
      }

      return;
    }

  }, true);
})();
</script>
